# vim:ft=kitty

enable_audio_bell no
update_check_interval 0
confirm_os_window_close 0

background_opacity 0.9
inactive_text_alpha 0.6

cursor_trail 3
cursor_trail_decay 0.1 0.4

font_family monospace
font_size 16

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

url_prefixes file ftp ftps gemini geo git gopher http https ipfs ipns irc ircs kitty magnet mailto news sftp ssh steam

# see some default keybindings at https://gist.github.com/AskinNet/0d0d4f7f0ee221f8362af9d9876d021a
# also be sure to check out the names of the "Boss" class's functions: https://github.com/kovidgoyal/kitty/blob/master/kitty/boss.py
# or see the default mappings directly (look at the map() and mma() functions): https://github.com/kovidgoyal/kitty/blob/master/kitty/options/definition.py
###
kitty_mod ctrl+shift

# override default 'new layout' bindings with 'new layout cwd' bindings
map kitty_mod+t new_tab_with_cwd
map kitty_mod+n new_window_with_cwd
map kitty_mod+enter new_os_window_with_cwd
# make tab handling more like the browser
map kitty_mod+w close_tab
map kitty_mod+q close_window
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# search
map kitty_mod+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

include theme.conf

